name: Microservices scaffold
on:
  pull_request:
    paths: ["services/**", "frontend/microservices/**", "shared/**", "infrastructure/**", "docker-compose.yml", ".github/workflows/microservices.yml"]
  push:
    branches: [main, "scaffold/**"]
    paths: ["services/**", "frontend/microservices/**", "shared/**", "infrastructure/**", "docker-compose.yml", ".github/workflows/microservices.yml"]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, ingestion-service, profiling-service, transformation-service, analytics-service, dashboard-service, ml-service, job-service, auth-service, export-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check app tests
      - run: uv run --frozen pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/microservices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/microservices/package-lock.json
      - run: npm ci
      - run: npm run build
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.microservices.example config --quiet
      - run: docker compose --env-file .env.microservices.example --profile extended --profile workers config --quiet
