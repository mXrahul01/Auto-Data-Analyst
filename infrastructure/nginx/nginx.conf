server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/v1/services { proxy_pass http://api-gateway:8000; }
    location /api/v1/gateway/ { proxy_pass http://api-gateway:8000/; }
    location /api/v1/ingestion/ { proxy_pass http://ingestion-service:8000/; }
    location /api/v1/profiling/ { proxy_pass http://profiling-service:8000/; }
    location /api/v1/transformation/ { proxy_pass http://transformation-service:8000/; }
    location /api/v1/ml/ { proxy_pass http://ml-service:8000/; }
    location /api/v1/jobs/ { proxy_pass http://job-service:8000/; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
