[project]
name = "ada-profiling-service"
version = "0.1.0"
description = "Data quality rules and evidence reports"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
